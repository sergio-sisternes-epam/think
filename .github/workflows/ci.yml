name: Think CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      candidate_revision:
        description: Exact main commit to validate before tagging
        required: false
        type: string
      package_source:
        description: Optional immutable owner/repo#ref install source
        required: false
        type: string
  workflow_call:
    inputs:
      candidate_revision:
        description: Exact peeled release commit to validate
        required: false
        type: string
      package_source:
        description: Local path or immutable remote source to install
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  APM_VERSION: "0.29.0"

jobs:
  metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate reusable candidate revision
        env:
          CANDIDATE_REVISION: ${{ inputs.candidate_revision }}
          PACKAGE_SOURCE: ${{ inputs.package_source }}
        run: |
          if [[ "$PACKAGE_SOURCE" == *"#"* ]] &&
            [ -z "$CANDIDATE_REVISION" ]; then
            echo "::error title=Missing candidate revision::Remote package validation requires an exact candidate SHA."
            exit 1
          fi
          if [ -n "$CANDIDATE_REVISION" ] &&
            { [ "${#CANDIDATE_REVISION}" -ne 40 ] ||
              [[ "$CANDIDATE_REVISION" == *[!0-9a-f]* ]]; }; then
            echo "::error title=Invalid candidate revision::Reusable release validation requires a full lowercase commit SHA."
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.candidate_revision || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run release-readiness tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Check release version surfaces
        id: release-metadata
        env:
          CANDIDATE_REVISION: ${{ inputs.candidate_revision || github.sha }}
        run: |
          python3 scripts/release_readiness.py \
            --commit "$CANDIDATE_REVISION" \
            --github-output "$GITHUB_OUTPUT"

  source:
    name: APM source integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.candidate_revision || github.sha }}
          persist-credentials: false
      - uses: microsoft/apm-action@d723bb64ed70c135bbaf87d126b721dd2dae0439 # v1
        with:
          setup-only: true
          apm-version: ${{ env.APM_VERSION }}
      - name: Audit tracked source files
        id: source-audit
        run: |
          python3 scripts/audit_source.py \
            --jobs 8 \
            --github-output "$GITHUB_OUTPUT"

  consumer:
    name: Consumer install (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: agent-skills
            target: agent-skills
          - name: stable-runtimes
            target: claude,codex,copilot,cursor,gemini,grok-build,kiro,opencode,windsurf
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.candidate_revision || github.sha }}
          persist-credentials: false
      - uses: microsoft/apm-action@d723bb64ed70c135bbaf87d126b721dd2dae0439 # v1
        with:
          apm-version: ${{ env.APM_VERSION }}
          setup-only: true
      - name: Install and replay in a disposable consumer
        id: consumer-validation
        env:
          EXPECTED_REVISION: ${{ inputs.candidate_revision }}
          GITHUB_TOKEN: ${{ inputs.package_source != '' && github.token || '' }}
          PACKAGE_SOURCE: ${{ inputs.package_source || '.' }}
          TARGETS: ${{ matrix.target }}
        run: |
          python3 scripts/validate_consumer.py \
            --source "$PACKAGE_SOURCE" \
            --target "$TARGETS" \
            --expected-revision "$EXPECTED_REVISION" \
            --github-output "$GITHUB_OUTPUT"

  readiness:
    name: Release readiness decision
    needs:
      - metadata
      - source
      - consumer
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: needs.metadata.result == 'success'
        with:
          ref: ${{ inputs.candidate_revision || github.sha }}
      - name: Verify exact current main
        id: exact-main
        if: >-
          needs.metadata.result == 'success' &&
          github.event_name != 'pull_request' &&
          github.ref_type != 'tag'
        env:
          CANDIDATE_REVISION: ${{ inputs.candidate_revision || github.sha }}
        run: |
          python3 scripts/release_readiness.py \
           --commit "$CANDIDATE_REVISION" \
           --require-current-main \
           --github-output "$GITHUB_OUTPUT"
      - name: Record candidate decision
        if: always()
        env:
          CANDIDATE_REVISION: ${{ inputs.candidate_revision || github.sha }}
          CONSUMER_RESULT: ${{ needs.consumer.result }}
          EVENT_NAME: ${{ github.event_name }}
          EXACT_MAIN_RESULT: ${{ steps.exact-main.outcome }}
          MAIN_REVISION: ${{ steps.exact-main.outputs.main_revision }}
          METADATA_RESULT: ${{ needs.metadata.result }}
          REF_TYPE: ${{ github.ref_type }}
          SOURCE_RESULT: ${{ needs.source.result }}
        run: |
          set -euo pipefail
          {
            echo "candidate_revision=$CANDIDATE_REVISION"
            echo "release_metadata=$METADATA_RESULT"
            echo "source_integrity=$SOURCE_RESULT"
            echo "consumer_install=$CONSUMER_RESULT"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$METADATA_RESULT" != success ] ||
            [ "$SOURCE_RESULT" != success ] ||
            [ "$CONSUMER_RESULT" != success ]; then
            echo "release_readiness_decision=blocked" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$EVENT_NAME" = pull_request ]; then
            echo "release_readiness_decision=pr-validated" |
              tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$REF_TYPE" = tag ]; then
            echo "release_readiness_decision=ready-to-publish" |
              tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "main_revision=$MAIN_REVISION" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$EXACT_MAIN_RESULT" != success ]; then
            {
              echo "release_readiness_decision=blocked"
              echo "release_readiness_reason=exact-main validation failed"
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "release_readiness_decision=ready-to-tag" |
            tee -a "$GITHUB_STEP_SUMMARY"
