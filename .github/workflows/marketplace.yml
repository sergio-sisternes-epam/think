name: Marketplace

on:
  push:
    branches: [main]
    tags: ['*/v*']              # matches scoped tags e.g. think-grill/v1.0.0
  workflow_dispatch:

permissions:
  contents: write               # needed to create GitHub Releases

jobs:
  validate:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/apm-action@v1
        with:
          setup-only: 'true'
          apm-version: '0.28.0'

      - name: Marketplace check
        run: apm marketplace check

      - name: Compile marketplace.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: apm pack

      - name: Detect drift on main
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -n "$(git status --porcelain .claude-plugin/marketplace.json)" ]; then
            echo "::error::marketplace.json is out of date — run 'apm pack' and commit."
            exit 1
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: microsoft/apm-action@v1
        with:
          setup-only: 'true'
          apm-version: '0.28.0'

      - name: Parse scoped tag
        id: tag
        run: |
          TAG_REF="${GITHUB_REF#refs/tags/}"

          if [[ ! "$TAG_REF" =~ ^[A-Za-z0-9._-]+/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[A-Za-z0-9.-]+)?(\+[A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Invalid tag format: ${TAG_REF}. Expected <package>/v<semver> (SemVer 2.0.0)"
            exit 1
          fi

          PACKAGE_NAME="${TAG_REF%%/v*}"
          PACKAGE_VERSION="${TAG_REF#*/v}"
          echo "package=${PACKAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG_REF}" >> "$GITHUB_OUTPUT"
          echo "📦 Package: ${PACKAGE_NAME}  Version: ${PACKAGE_VERSION}"

      - name: Resolve package subdirectory
        id: resolve
        env:
          PACKAGE_NAME: ${{ steps.tag.outputs.package }}
        run: |
          SUBDIR=$(find packages -type f -name "apm.yml" -path "*/${PACKAGE_NAME}/apm.yml" \
            | head -1 | xargs dirname 2>/dev/null || true)
          if [ -z "${SUBDIR}" ] || [ ! -d "${SUBDIR}" ]; then
            echo "::error::Could not find package directory for: ${PACKAGE_NAME}"
            exit 1
          fi
          echo "subdir=${SUBDIR}" >> "$GITHUB_OUTPUT"
          echo "📂 Subdirectory: ${SUBDIR}"

      - name: Pack package archive
        id: pack
        run: |
          ARCHIVE="${{ steps.tag.outputs.package }}-v${{ steps.tag.outputs.version }}.tar.gz"
          tar -czf "${ARCHIVE}" -C "$(dirname '${{ steps.resolve.outputs.subdir }}')" "$(basename '${{ steps.resolve.outputs.subdir }}')"
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"
          echo "📦 Archive: ${ARCHIVE} ($(du -h "${ARCHIVE}" | cut -f1))"

      - name: Marketplace check
        run: apm marketplace check

      - name: Compile marketplace.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: apm pack

      - name: Generate package-scoped release notes
        id: notes
        env:
          PACKAGE_NAME: ${{ steps.tag.outputs.package }}
          PACKAGE_VERSION: ${{ steps.tag.outputs.version }}
          PACKAGE_SUBDIR: ${{ steps.resolve.outputs.subdir }}
        run: |
          git fetch --tags --quiet || true

          PREV_TAG=$(git tag -l "${PACKAGE_NAME}/v*" --sort=-v:refname \
            | grep -v "^${PACKAGE_NAME}/v${PACKAGE_VERSION}$" \
            | head -1 || true)

          if [ -n "${PREV_TAG}" ]; then
            RANGE="${PREV_TAG}..HEAD"
            echo "📋 Changelog since ${PREV_TAG}"
          else
            RANGE="HEAD"
            echo "📋 Initial release (no prior scoped tag)"
          fi

          {
            echo "body<<RELEASE_NOTES_EOF"
            echo "## ${PACKAGE_NAME} v${PACKAGE_VERSION}"
            echo ""

            if [ -n "${PREV_TAG}" ]; then
              COMMITS=$(git log "${RANGE}" --pretty=format:"- %s (%h)" -- "${PACKAGE_SUBDIR}")
            else
              COMMITS=$(git log --pretty=format:"- %s (%h)" -- "${PACKAGE_SUBDIR}")
            fi

            if [ -n "${COMMITS}" ]; then
              echo "### Changes"
              echo ""
              echo "${COMMITS}"
            else
              echo "*No changes to package files in this release.*"
            fi

            echo ""
            echo "---"
            echo "📦 Install: \`apm marketplace add sergio-sisternes-epam/think && apm install ${PACKAGE_NAME}@think\`"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ steps.tag.outputs.package }} v${{ steps.tag.outputs.version }}"
          body: ${{ steps.notes.outputs.body }}
          files: |
            ${{ steps.pack.outputs.archive }}
            .claude-plugin/marketplace.json
